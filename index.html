<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Password</title>
    <style>
        /* This CSS makes it look like a classic retro terminal game */
        body {
            background-color: #121212;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }
        #game-text {
            margin-bottom: 20px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        #input-container {
            display: flex;
        }
        #prompt-symbol {
            margin-right: 10px;
        }
        input {
            background: transparent;
            border: none;
            color: #33ff33;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <!-- This is where the game narrative appears -->
    <div id="game-text">WHATEVER THE PASSWORD IS</div>

</body>
</html>
