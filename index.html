<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon & Garfunkel Adventure</title>
  <style>
    /* Classic retro terminal styling */
    body {
      background-color: #111;
      color: #33ff33;
      font-family: 'Courier New', Courier, monospace;
      padding: 40px;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
    }

    #story-box {
      border: 1px solid #33ff33;
      padding: 20px;
      min-height: 150px;
      margin-bottom: 20px;
      background-color: #0a0a0a;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      background-color: #000;
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 10px;
      font-family: inherit;
      font-size: 16px;
      flex-grow: 1;
      outline: none;
    }

    button {
      background-color: #33ff33;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #28cc28;
    }

    #feedback {
      margin-top: 15px;
      color: #ff4444;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <!-- Where the story text appears -->
  <div id="story-box"></div>

  <!-- Input controls -->
  <div class="input-area" id="controls">
    <input type="text" id="code-input" placeholder="Enter confirmation code..." autocomplete="off">
    <button id="submit-btn">ENTER</button>
  </div>

  <!-- Error or status messages -->
  <div id="feedback"></div>

  <script>
    // 1. DEFINE YOUR 5 STAGES HERE
    const stages = [
      {
        text: "Say this password over the phone (no texting allowed): typethisintwicealluppercaseNOspacesLOWERCASE",
        code: "art"
      },
      {
        text: "Say this password over the phone (no texting allowed): EnterTheWords485then-colonTHENUMBERtwo",
        code: "boxer"
      },
      {
        text: "Say this password over the phone (no texting allowed): CarrotCaretKarrritThenTheSymbol^",
        code: "groovy"
      },
      {
        text: "Say this password over the phone (no texting allowed): .dot,comma..commaTHEWORDcommaINQUOTES",
        code: "homeward"
      },
      {
        text: "Say this password over the phone (no texting allowed): Under_and_Score_wordsseperatedbyhyphens",
        code: "silence"
      }
    ];

    // Text shown after beating all 5 stages
    const victoryText = "CONGRATULATIONS! You got them all.";

    // 2. GAME STATE & HTML ELEMENTS
    let currentStage = 0;

    const storyBox = document.getElementById("story-box");
    const codeInput = document.getElementById("code-input");
    const submitBtn = document.getElementById("submit-btn");
    const feedback = document.getElementById("feedback");
    const controls = document.getElementById("controls");

    // 3. GAME FUNCTIONS
    function loadStage() {
      if (currentStage < stages.length) {
        storyBox.textContent = stages[currentStage].text;
        codeInput.value = "";
        codeInput.focus();
      } else {
        // End of the 5-stage sequence
        storyBox.textContent = victoryText;
        controls.style.display = "none"; // Hide input box when finished
        feedback.textContent = "";
      }
    }

    function checkCode() {
      // Clean up the user's input (remove extra spaces, make lowercase)
      const userGuess = codeInput.value.trim().toLowerCase();
      const correctCode = stages[currentStage].code.toLowerCase();

      if (userGuess === correctCode) {
        feedback.textContent = "";
        currentStage++; // Move to the next stage
        loadStage();
      } else {
        feedback.textContent = "Incorrect code word. Try again.";
        codeInput.value = "";
        codeInput.focus();
      }
    }

    // 4. EVENT LISTENERS (Click button or press Enter key)
    submitBtn.addEventListener("click", checkCode);

    codeInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkCode();
      }
    });

    // Start the game on page load
    loadStage();
  </script>

</body>
</html>
Use code with caution.

How It Works

• Easy Customization: All your story prompts and passwords live inside the stages list at the top of the <script> tag. You can swap out the text and code words without changing anything else.
• Forgiving Input: The checkCode() function uses .trim().toLowerCase() so players won't fail if they accidentally type a capital letter or an extra space.
• Keyboard Friendly: Players can either click the ENTER button or press the Enter key on their keyboard to submit a guess.
