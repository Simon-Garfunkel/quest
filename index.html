<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Adventure</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #33ff33;
      font-family: 'Courier New', Courier, monospace;
      padding: 40px;
      font-size: 18px;
      line-height: 1.5;
    }
    #terminal {
      max-width: 700px;
      margin: 0 auto;
    }
    #log {
      white-space: pre-wrap;
    }
    .input-line {
      display: none; /* Hidden by default until text finishes printing */
      margin-top: 15px;
    }
    .prompt-symbol {
      margin-right: 10px;
    }
    input {
      background: transparent;
      border: none;
      color: #33ff33;
      font-family: inherit;
      font-size: inherit;
      outline: none;
      width: 100%;
    }
    .error {
      color: #ff4444;
    }
  </style>
</head>
<body>

<div id="terminal">
  <div id="log"></div>
  <div class="input-line" id="input-container">
    <span class="prompt-symbol">&gt;</span>
    <input type="text" id="command-input" autocomplete="off" placeholder="Enter confirmation password...">
  </div>
</div>

<script>
  const stages = [
    {
      story: `SECURITY CHECK 1 OF 4
The heavy blast door hisses as steam vents from the ceiling.
A dusty terminal flickers to life in front of you.

SYSTEM: Enter the Sector A override code.`,
      password: "ALPHA"
    },
    {
      story: `SECURITY CHECK 2 OF 4
Primary locks disengaged. Red warning lights begin to flash.
The floor vibrates beneath your boots.

SYSTEM: Enter the Coolant Core passcode.`,
      password: "BRAVO"
    },
    {
      story: `SECURITY CHECK 3 OF 4
Warning! Auxiliary power routing to main bulkhead.
Temperature rising rapidly.

SYSTEM: Confirm manual override.`,
      password: "CHARLIE"
    },
    {
      story: `SECURITY CHECK 4 OF 4
Final seal reached. Only one heavy deadbolt remains.

SYSTEM: Enter Commander authorization.`,
      password: "DELTA"
    }
  ];

  let currentStep = 0;
  let isTyping = false;

  const log = document.getElementById("log");
  const input = document.getElementById("command-input");
  const inputContainer = document.getElementById("input-container");

  // Instant print for system responses and user echoes
  function printLine(text, className = "") {
    const p = document.createElement("p");
    p.textContent = text;
    if (className) p.className = className;
    log.appendChild(p);
    window.scrollTo(0, document.body.scrollHeight);
  }

  // Typewriter print that hides the prompt until the story is done
  function typeStory(text, onComplete) {
    isTyping = true;
    inputContainer.style.display = "none"; // Hide prompt while printing

    const p = document.createElement("p");
    log.appendChild(p);

    let index = 0;
    const speed = 25; // Speed in milliseconds per letter (lower = faster)

    const timer = setInterval(() => {
      p.textContent += text.charAt(index);
      index++;
      window.scrollTo(0, document.body.scrollHeight);

      if (index >= text.length) {
        clearInterval(timer);
        isTyping = false;
        if (onComplete) onComplete();
      }
    }, speed);
  }

  // Show the input box and focus the cursor
  function showPrompt() {
    inputContainer.style.display = "flex";
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }

  // Start the first stage
  typeStory(stages[currentStep].story, showPrompt);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !isTyping) {
      const userGuess = input.value.trim();
      input.value = "";

      printLine("> " + userGuess);

      if (userGuess.toUpperCase() === stages[currentStep].password.toUpperCase()) {
        printLine("ACCESS GRANTED.");
        currentStep++;

        if (currentStep < stages.length) {
          printLine("----------------------------------------");
          // Print the next story, then show the prompt once finished
          typeStory(stages[currentStep].story, showPrompt);
        } else {
          printLine("----------------------------------------");
          typeStory("ALL 4 SECURITY CHECKS PASSED. THE VAULT DOOR OPENS!");
        }
      } else {
        printLine("ACCESS DENIED. Incorrect password. Try again.", "error");
      }
    }
  });
</script>

</body>
</html>
